<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#091525;stop-opacity:1" />
    </linearGradient>

    <!-- Accent gradient for name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="50%" style="stop-color:#7b5ea7" />
      <stop offset="100%" style="stop-color:#ff6b6b" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for orbs -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
    </pattern>

    <!-- Clip path for rounded corners -->
    <clipPath id="roundedClip">
      <rect width="1500" height="500" rx="0"/>
    </clipPath>

    <!-- Tech badge gradient -->
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff20"/>
      <stop offset="100%" style="stop-color:#00d4ff05"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b5ea720"/>
      <stop offset="100%" style="stop-color:#7b5ea705"/>
    </linearGradient>
    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b20"/>
      <stop offset="100%" style="stop-color:#ff6b6b05"/>
    </linearGradient>
    <linearGradient id="badgeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffaa20"/>
      <stop offset="100%" style="stop-color:#00ffaa05"/>
    </linearGradient>

    <!-- Diagonal line pattern -->
    <pattern id="diag" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff04" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#diag)"/>

  <!-- Ambient orbs -->
  <circle cx="150" cy="100" r="200" fill="#00d4ff" opacity="0.04" filter="url(#softGlow)"/>
  <circle cx="1350" cy="400" r="250" fill="#7b5ea7" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="800" cy="500" r="300" fill="#ff6b6b" opacity="0.03" filter="url(#softGlow)"/>
  <circle cx="1100" cy="80" r="180" fill="#00ffaa" opacity="0.03" filter="url(#softGlow)"/>

  <!-- Left decorative line block -->
  <rect x="80" y="130" width="4" height="240" rx="2" fill="url(#nameGrad)" opacity="0.9"/>
  <rect x="90" y="160" width="2" height="180" rx="1" fill="#00d4ff" opacity="0.3"/>

  <!-- Decorative dots top-left -->
  <circle cx="130" cy="140" r="3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="145" cy="140" r="3" fill="#7b5ea7" opacity="0.6"/>
  <circle cx="160" cy="140" r="3" fill="#ff6b6b" opacity="0.6"/>

  <!-- Decorative dots bottom-right -->
  <circle cx="1340" cy="360" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="1355" cy="360" r="3" fill="#7b5ea7" opacity="0.5"/>
  <circle cx="1370" cy="360" r="3" fill="#00ffaa" opacity="0.5"/>

  <!-- Top subtle line -->
  <line x1="80" y1="80" x2="1420" y2="80" stroke="#ffffff08" stroke-width="1"/>
  <!-- Bottom subtle line -->
  <line x1="80" y1="420" x2="1420" y2="420" stroke="#ffffff08" stroke-width="1"/>

  <!-- Corner accents -->
  <!-- Top-left -->
  <path d="M 30 30 L 80 30 L 80 40" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <path d="M 30 30 L 30 80 L 40 80" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <!-- Top-right -->
  <path d="M 1470 30 L 1420 30 L 1420 40" fill="none" stroke="#7b5ea7" stroke-width="2" opacity="0.7"/>
  <path d="M 1470 30 L 1470 80 L 1460 80" fill="none" stroke="#7b5ea7" stroke-width="2" opacity="0.7"/>
  <!-- Bottom-left -->
  <path d="M 30 470 L 80 470 L 80 460" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
  <path d="M 30 470 L 30 420 L 40 420" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
  <!-- Bottom-right -->
  <path d="M 1470 470 L 1420 470 L 1420 460" fill="none" stroke="#00ffaa" stroke-width="2" opacity="0.7"/>
  <path d="M 1470 470 L 1470 420 L 1460 420" fill="none" stroke="#00ffaa" stroke-width="2" opacity="0.7"/>

  <!-- MAIN CONTENT AREA -->

  <!-- Small label above name -->
  <text x="118" y="170" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" opacity="0.8" letter-spacing="4">👋 HELLO, I'M</text>

  <!-- Main name - ODJO -->
  <text x="115" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="-2">ODJO</text>

  <!-- Main name - Mahugnon Justin -->
  <text x="115" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#ffffff" opacity="0.92" letter-spacing="1">Mahugnon Justin</text>

  <!-- Role subtitle -->
  <text x="118" y="368" font-family="'Courier New', monospace" font-size="19" fill="#a0b4cc" letter-spacing="2">✦ Full Stack &amp; Mobile Developer ✦</text>

  <!-- Divider line before tech badges -->
  <line x1="115" y1="395" x2="820" y2="395" stroke="#ffffff10" stroke-width="1"/>

  <!-- Tech stack badges -->
  <!-- Vue.js badge -->
  <rect x="115" y="408" width="130" height="36" rx="18" fill="url(#badgeGrad1)" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
  <text x="180" y="431" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" text-anchor="middle" letter-spacing="1">⬡ Vue.js</text>

  <!-- Spring Boot badge -->
  <rect x="257" y="408" width="165" height="36" rx="18" fill="url(#badgeGrad4)" stroke="#00ffaa" stroke-width="1" opacity="0.9"/>
  <text x="340" y="431" font-family="'Courier New', monospace" font-size="14" fill="#00ffaa" text-anchor="middle" letter-spacing="1">⚙ Spring Boot</text>

  <!-- Flutter badge -->
  <rect x="434" y="408" width="140" height="36" rx="18" fill="url(#badgeGrad2)" stroke="#7b5ea7" stroke-width="1" opacity="0.9"/>
  <text x="504" y="431" font-family="'Courier New', monospace" font-size="14" fill="#a78bfa" text-anchor="middle" letter-spacing="1">◈ Flutter</text>

  <!-- Figma badge -->
  <rect x="586" y="408" width="130" height="36" rx="18" fill="url(#badgeGrad3)" stroke="#ff6b6b" stroke-width="1" opacity="0.9"/>
  <text x="651" y="431" font-family="'Courier New', monospace" font-size="14" fill="#ff6b6b" text-anchor="middle" letter-spacing="1">◉ Figma</text>

  <!-- RIGHT SIDE - Abstract code / decoration panel -->
  <!-- Large geometric shape background -->
  <polygon points="950,40 1460,40 1460,460 850,460" fill="#ffffff03" stroke="#ffffff06" stroke-width="1"/>

  <!-- Floating code lines decoration -->
  <!-- Line group 1 -->
  <rect x="1000" y="120" width="220" height="3" rx="2" fill="#00d4ff" opacity="0.15"/>
  <rect x="1020" y="132" width="160" height="3" rx="2" fill="#7b5ea7" opacity="0.15"/>
  <rect x="1010" y="144" width="190" height="3" rx="2" fill="#ff6b6b" opacity="0.10"/>
  <rect x="1040" y="156" width="130" height="3" rx="2" fill="#00ffaa" opacity="0.15"/>

  <!-- Code snippet styled text -->
  <text x="980" y="115" font-family="'Courier New', monospace" font-size="12" fill="#00d4ff" opacity="0.4">class Developer {</text>
  <text x="1000" y="138" font-family="'Courier New', monospace" font-size="12" fill="#a0b4cc" opacity="0.35">  name: "ODJO Justin"</text>
  <text x="1000" y="161" font-family="'Courier New', monospace" font-size="12" fill="#a0b4cc" opacity="0.35">  stack: ["Vue", "Spring",</text>
  <text x="1000" y="184" font-family="'Courier New', monospace" font-size="12" fill="#a0b4cc" opacity="0.35">    "Flutter", "Figma"]</text>
  <text x="1000" y="207" font-family="'Courier New', monospace" font-size="12" fill="#00ffaa" opacity="0.4">  passion: "Building</text>
  <text x="1000" y="228" font-family="'Courier New', monospace" font-size="12" fill="#00ffaa" opacity="0.4">    great products"</text>
  <text x="980" y="251" font-family="'Courier New', monospace" font-size="12" fill="#00d4ff" opacity="0.4">}</text>

  <!-- Large decorative circles right side -->
  <circle cx="1300" cy="250" r="160" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="1300" cy="250" r="120" fill="none" stroke="#7b5ea7" stroke-width="1" opacity="0.10"/>
  <circle cx="1300" cy="250" r="80" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.08"/>

  <!-- Inner decorative element -->
  <circle cx="1300" cy="250" r="40" fill="#00d4ff" opacity="0.04"/>
  <circle cx="1300" cy="250" r="8" fill="#00d4ff" opacity="0.4"/>
  <circle cx="1300" cy="250" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- Orbit dots -->
  <circle cx="1300" cy="90" r="5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="1460" cy="250" r="5" fill="#7b5ea7" opacity="0.6"/>
  <circle cx="1300" cy="410" r="5" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="1140" cy="250" r="5" fill="#00ffaa" opacity="0.6"/>

  <!-- Lines from orbit dots to center -->
  <line x1="1300" y1="95" x2="1300" y2="210" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
  <line x1="1455" y1="250" x2="1340" y2="250" stroke="#7b5ea7" stroke-width="1" opacity="0.15"/>
  <line x1="1300" y1="405" x2="1300" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.15"/>
  <line x1="1145" y1="250" x2="1260" y2="250" stroke="#00ffaa" stroke-width="1" opacity="0.15"/>

  <!-- Tech labels near orbit -->
  <text x="1315" y="86" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" opacity="0.7">Vue.js</text>
  <text x="1375" y="200" font-family="'Courier New', monospace" font-size="11" fill="#7b5ea7" opacity="0.7">Spring</text>
  <text x="1310" y="430" font-family="'Courier New', monospace" font-size="11" fill="#ff6b6b" opacity="0.7">Flutter</text>
  <text x="1070" y="255" font-family="'Courier New', monospace" font-size="11" fill="#00ffaa" opacity="0.7">Figma</text>

  <!-- Subtle scanline effect at bottom -->
  <rect x="0" y="460" width="1500" height="40" fill="url(#bgGrad)" opacity="0.5"/>

  <!-- Bottom signature line -->
  <text x="750" y="490" font-family="'Courier New', monospace" font-size="11" fill="#ffffff20" text-anchor="middle" letter-spacing="6">FULL STACK • MOBILE • UI/UX</text>
</svg>
